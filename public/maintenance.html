<!DOCTYPE html>
<html lang="it" id="html-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>In aggiornamento / Under Maintenance — Gianluca Piazza</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --text: #f0f0f0;
      --muted: #666;
      --accent: #c8a96e;
      --border: rgba(255,255,255,0.07);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 2.5rem;
      opacity: 0.9;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(200,169,110,0.08);
      border: 1px solid rgba(200,169,110,0.2);
      border-radius: 99px;
      padding: 0.3em 0.9em;
      margin-bottom: 1.8rem;
    }

    .badge::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.6rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 1rem;
      color: var(--text);
    }

    p {
      font-size: 1rem;
      color: var(--muted);
      max-width: 380px;
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2.5rem;
    }

    .contact {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .contact a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(200,169,110,0.3);
      padding-bottom: 1px;
      transition: opacity 0.2s;
    }

    .contact a:hover { opacity: 0.75; }

    .lang-switch {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 0.4rem;
    }

    .lang-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3em 0.65em;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .lang-btn.active,
    .lang-btn:hover {
      color: var(--accent);
      border-color: rgba(200,169,110,0.4);
    }

    [data-lang] { display: none; }
    .lang-it [data-lang="it"],
    .lang-en [data-lang="en"] { display: block; }
  </style>
</head>
<body class="lang-it">

  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('it')" id="btn-it">IT</button>
    <button class="lang-btn" onclick="setLang('en')" id="btn-en">EN</button>
  </div>

  <img class="logo" src="/logo.svg" alt="GP" onerror="this.style.display='none'" />

  <div class="badge">
    <span data-lang="it">In aggiornamento</span>
    <span data-lang="en">Under Maintenance</span>
  </div>

  <h1>
    <span data-lang="it">Torneremo presto.</span>
    <span data-lang="en">We’ll be back soon.</span>
  </h1>

  <p>
    <span data-lang="it">Il sito è momentaneamente offline per aggiornamenti. Ci vediamo tra poco.</span>
    <span data-lang="en">The site is temporarily offline for updates. See you shortly.</span>
  </p>

  <div class="divider"></div>

  <p class="contact">
    <span data-lang="it">Seguici su LinkedIn:</span>
    <span data-lang="en">Follow us on LinkedIn:</span>
    <a href="https://www.linkedin.com/company/gp-and-partners/">GP & Partners</a>
  </p>

  <script>
    function setLang(lang) {
      document.body.className = 'lang-' + lang;
      document.getElementById('html-root').lang = lang;
      document.getElementById('btn-it').classList.toggle('active', lang === 'it');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      localStorage.setItem('lang', lang);
    }
    (function() {
      var saved = localStorage.getItem('lang');
      var browser = (navigator.language || '').toLowerCase().startsWith('it') ? 'it' : 'en';
      setLang(saved || browser);
    })();
  </script>
</body>
</html>
